# Dedicated Alacritty config for ZoxPortal (zoxide_launcher.cmd) only.
# Imports all regular settings and only overrides the window position,
# so the zoxide/runner window starts centered instead of top left.

[general]
import = ["~/AppData/Roaming/alacritty/alacritty.toml"]

[font]
# Only overrides the size, the font family comes from the main config
size = 14.0

[window]
# Rough centering for 2560x1440 (Alacritty has no "center" option,
# only a fixed start position; does not adapt to other resolutions).
position = { x = 830, y = 420 }
