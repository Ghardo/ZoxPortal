# Dedicated Alacritty config for ZoxPortal (zoxide_launcher.cmd) only.
# Imports all regular settings and only overrides font size and window position.

[general]
# window-position.toml is generated by focus_window.ps1 (centered start position
# for the current screen, avoids the window jumping on start). Missing on first run.
import = [
    "~/AppData/Roaming/alacritty/alacritty.toml",
    "window-position.toml",
]

[font]
# Only overrides the size, the font family comes from the main config
size = 14.0
